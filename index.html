      { icon: '🗑', label: 'Delete', danger: true, run: () => { deleteBlock(date, id); flash(`Deleted “${b.title}”`, undo); } },
      ...(b.seriesId ? [{ icon: '↻', label: 'Delete this & future repeats', danger: true, run: () => deleteFuture(date, id) }] : []),
    ];
  };
  const menuActions = menu ? actionsFor(menu.date, menu.id) : [];
  const sheetBlock = sheet ? findBlock(sheet.date, sheet.id) : null;
  const sheetActions = sheetBlock ? (() => { const a = actionsFor(sheet.date, sheet.id), i = a.findIndex(x => x.label === 'Edit…'); return i > 0 ? [a[i], ...a.filter((_, j) => j !== i)] : a; })() : [];

  const moreItems = [
    { icon: '📊', label: 'Insights', run: () => setModal({ type: 'insights' }) },
    { icon: '🗂', label: 'Day templates…', run: () => setModal({ type: 'tpls' }) },
    '-',
    { icon: '⬇', label: 'Export backup (.json)', run: exportJSON },
    { icon: '⬆', label: 'Import backup (.json)', run: () => jsonRef.current && jsonRef.current.click() },
    { icon: '📅', label: 'Export calendar (.ics)', run: exportICS },
    { icon: '📥', label: 'Import calendar (.ics)', run: () => icsRef.current && icsRef.current.click() },
    '-',
    { icon: cfg.theme === 'dark' ? '☀' : '☾', label: cfg.theme === 'dark' ? 'Light theme' : 'Dark theme', run: () => patchCfg({ theme: cfg.theme === 'dark' ? 'light' : 'dark' }) },
    { icon: '⚙', label: 'Work hours & settings…', run: () => setModal({ type: 'settings' }) },
    { icon: '⌨', label: 'Keyboard shortcuts', run: () => setModal({ type: 'help' }) },
    '-',
    { icon: '🧹', label: 'Clear all data (start blank)…', run: clearAll },
  ];

  const focusBlock = settings.focus ? findBlock(settings.focus.date, settings.focus.id) : null;
  const sideStyle = narrow
    ? { position: 'fixed', top: 0, bottom: 0, left: 0, zIndex: 95, transform: sideOpen ? 'none' : 'translateX(-105%)', transition: 'transform .2s', boxShadow: sideOpen ? '0 0 40px rgba(0,0,0,.6)' : 'none' }
    : {};
  const secTitle = { flex: 1, fontSize: 12, textTransform: 'uppercase', letterSpacing: '.08em', color: 'var(--muted)' };

  return (
    <div style={{ display: 'flex', height: '100%' }}
      onTouchStart={e => {
        if (!narrow || e.touches.length !== 1) return;
        const p = e.touches[0], sc = document.querySelector('[data-scroller]');
        swipe.current = { x: p.clientX, y: p.clientY, t: Date.now(), skip: !!e.target.closest('.hscroll, .noswipe, input, textarea, select') || (view === 'week' && sc && sc.scrollLeft > 0) };
      }}
      onTouchEnd={e => {
        const sw = swipe.current; swipe.current = null;
        if (!sw || sw.skip || touchDragging.current || modal || menu || moreOpen || syncChoice) return;
        const p = e.changedTouches[0], dx = p.clientX - sw.x, dy = p.clientY - sw.y;
        if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.6 || Date.now() - sw.t > 800) return;
        if (!sideOpen && dx > 0) setSideOpen(true); else if (sideOpen && dx < 0) setSideOpen(false);
      }}>
      {narrow && sideOpen && <div onClick={() => setSideOpen(false)} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,.5)', zIndex: 94 }} />}
      {/* sidebar */}
      <aside style={{ width: narrow ? 'min(300px, 86vw)' : 264, flex: 'none', borderRight: '1px solid var(--line)', background: 'var(--surface)', display: 'flex', flexDirection: 'column', padding: '14px 12px', gap: 14, overflow: 'auto', ...sideStyle }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '0 6px' }}>
          <div style={{ width: 28, height: 28, borderRadius: 8, background: 'linear-gradient(135deg,#8ab4f8,#c58af9)', display: 'grid', placeItems: 'center', color: '#0c1c3a', fontWeight: 700, fontSize: 14 }}>▤</div>
          <div style={{ fontSize: 18, fontWeight: 500, letterSpacing: '-.01em' }}>Timeblock</div>
        </div>
        <button className="btn" style={{ alignSelf: 'flex-start', padding: '10px 20px', borderRadius: 16, boxShadow: '0 2px 8px rgba(0,0,0,.25)' }} onClick={() => openAdd()}>
          <span style={{ fontSize: 20, lineHeight: 1, color: 'var(--accent)' }}>+</span> Create
        </button>
        <MiniCal cur={cur} onPick={d => { setCur(d); if (narrow) setSideOpen(false); }} days={days} hidden={hidden} view={view} todayKey={todayKey} />

        {/* inbox */}
        <div>
          <div style={{ display: 'flex', alignItems: 'baseline', padding: '0 6px 6px' }}>
            <div style={secTitle}>Pending tasks</div>
            <div style={{ fontSize: 10.5, color: 'var(--faint)' }}>{inbox.length ? (narrow ? 'hold & drag onto calendar' : 'drag onto calendar') : 'unscheduled'}</div>
          </div>
          {inbox.map(t => (
            <div key={t.id} className="stamp" onMouseDown={e => startInboxDrag(e, t, tgt => scheduleInbox(t, tgt))} onTouchStart={e => startTouchDrag(e, t, tgt => scheduleInbox(t, tgt))} onContextMenu={e => e.preventDefault()} style={{ cursor: 'grab', userSelect: 'none' }} title="Drag onto the calendar">
              <span style={{ width: 10, height: 10, borderRadius: 3, background: t.color, flex: 'none' }} />
              <span style={{ flex: 1, minWidth: 0 }}>
                <span style={{ display: 'block', fontSize: 13, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{t.title}</span>
                <span className="mono" style={{ fontSize: 10.5, color: 'var(--faint)' }}>{fmtDur(t.dur)} · {t.cat}</span>
              </span>
              <span className="x" role="button" title="Schedule at end of the selected day" onMouseDown={e => e.stopPropagation()} onClick={() => scheduleInbox(t, { date: curKey, start: null })} style={{ color: 'var(--accent)', fontSize: 15, padding: '0 3px', cursor: 'pointer' }}>＋</span>
              <span className="x" role="button" aria-label="Remove" onMouseDown={e => e.stopPropagation()} onClick={() => setInbox(l => l.filter(x => x.id !== t.id))} style={{ color: 'var(--faint)', fontSize: 12, padding: '0 2px', cursor: 'pointer' }}>✕</span>
            </div>
          ))}
          <div style={{ display: 'flex', gap: 6, padding: '4px 4px 0' }}>
            <input className="field" style={{ padding: '6px 8px', fontSize: 13 }} placeholder="Add an unscheduled task…" value={inForm.title}
              onChange={e => setInForm({ ...inForm, title: e.target.value })} onKeyDown={e => { if (e.key === 'Enter') addInbox(); }} />
          </div>
          <div style={{ display: 'flex', gap: 6, padding: '6px 4px 0' }}>
            <input className="field mono" type="number" min="1" max="1440" title="Minutes" style={{ padding: '5px 8px', fontSize: 12, width: 64 }} value={inForm.dur} onChange={e => setInForm({ ...inForm, dur: e.target.value })} />
            <select className="field" style={{ padding: '5px 6px', fontSize: 12 }} value={inForm.cat} onChange={e => setInForm({ ...inForm, cat: e.target.value })}>{Object.keys(CATS).map(c => <option key={c}>{c}</option>)}</select>
            <button className="btn primary" style={{ padding: '4px 12px' }} onClick={addInbox}>Add</button>
          </div>
        </div>

        <div>
          <div style={{ display: 'flex', alignItems: 'baseline', padding: '0 6px 6px', gap: 8 }}>
            <div style={secTitle}>Categories</div>
            <button onClick={() => setHidden([])} style={{ background: 'none', border: 0, fontSize: 11, color: 'var(--accent)', padding: 0 }}>All</button>
            <button onClick={() => setHidden(Object.keys(CATS))} style={{ background: 'none', border: 0, fontSize: 11, color: 'var(--accent)', padding: 0 }}>None</button>
          </div>
          {Object.entries(CATS).map(([c, col]) => {
            const on = !hidden.includes(c);
            return (
              <button key={c} className="stamp" onClick={() => toggleCat(c)} aria-pressed={on} style={{ padding: '5px 9px' }}>
                <span style={{ width: 16, height: 16, borderRadius: 4, flex: 'none', display: 'grid', placeItems: 'center', fontSize: 11, fontWeight: 700, color: '#101114', background: on ? col : 'transparent', border: `2px solid ${col}` }}>{on ? '✓' : ''}</span>
                <span style={{ flex: 1, fontSize: 13, color: on ? 'var(--text)' : 'var(--faint)', textDecoration: on ? 'none' : 'line-through' }}>{c}</span>
                <span className="mono" style={{ fontSize: 11, color: 'var(--faint)' }}>{catCounts[c] || ''}</span>
              </button>
            );
          })}
        </div>
        <div>
          <div style={{ display: 'flex', alignItems: 'baseline', padding: '0 6px 6px' }}>
            <div style={secTitle}>Quick Stamp</div>
            <div style={{ fontSize: 10.5, color: 'var(--faint)' }}>{narrow ? 'tap · or hold & drag' : 'click or drag · by use'}</div>
          </div>
          {sortedTasks.map(t => (
            <button key={t.id} className="stamp" onClick={() => stamp(t)} onMouseDown={e => startInboxDrag(e, { title: t.name, dur: t.dur, color: t.color }, tgt => stampAt(t, tgt))} onTouchStart={e => startTouchDrag(e, { title: t.name, dur: t.dur, color: t.color }, tgt => stampAt(t, tgt))} onContextMenu={e => e.preventDefault()} style={{ cursor: 'grab', userSelect: 'none' }} title="Click to append to the selected day · drag onto the calendar">
              <span style={{ width: 10, height: 10, borderRadius: 3, background: t.color, flex: 'none' }} />
              <span style={{ flex: 1, minWidth: 0 }}>
                <span style={{ display: 'block', fontSize: 13, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{t.name}</span>
                <span className="mono" style={{ fontSize: 10.5, color: 'var(--faint)' }}>{t.dur}m · {t.cat}</span>
              </span>
              <span className="mono" style={{ fontSize: 11, color: 'var(--muted)' }}>×{t.uses}</span>
              <span className="x" role="button" aria-label="Remove template" onClick={e => { e.stopPropagation(); setTasks(ts => ts.filter(x => x.id !== t.id)); }} style={{ color: 'var(--faint)', fontSize: 12, padding: '0 2px' }}>✕</span>
            </button>
          ))}
          {!sortedTasks.length && <div style={{ padding: '4px 8px', fontSize: 12, color: 'var(--faint)' }}>No templates. Tick “save as Quick Stamp” when adding a block.</div>}
        </div>
        <div style={{ marginTop: 'auto', padding: '10px 8px 0', borderTop: '1px solid var(--line)' }}>
          <div style={{ fontSize: 10.5, textTransform: 'uppercase', letterSpacing: '.08em', color: 'var(--faint)', marginBottom: 6 }}>Energy rhythm</div>
          <div style={{ height: 8, borderRadius: 4, background: `linear-gradient(90deg, rgba(126,134,200,.5), rgba(129,201,149,.55) 40%, rgba(126,134,200,.5))` }} />
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10.5, color: 'var(--faint)', marginTop: 4 }}><span>Dip 2–4pm</span><span>Peak 9am–12pm</span></div>
        </div>
      </aside>

      {/* main */}
      <main style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, minHeight: 0 }}>
        {(() => {
          const compactTitle = view === 'month' ? `${MONTHS[cur.getMonth()].slice(0, 3)} ${cur.getFullYear()}` : (view === 'day' || view === 'agenda') ? cur.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : title;
          const cls = narrow ? 'btn sm' : 'btn';
          const hardStopEl = (
            <label style={{ flex: 'none', display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 12, color: 'var(--muted)', border: '1px solid var(--line-strong)', borderRadius: 999, padding: narrow ? '2px 3px 2px 11px' : '3px 4px 3px 12px' }}>
              <span style={{ color: 'var(--warn)', whiteSpace: 'nowrap' }}>⛔ Hard stop</span>
              <input type="time" step="900" value={cfg.hardStop} onChange={e => e.target.value && patchCfg({ hardStop: e.target.value })} className="mono"
                style={{ background: 'var(--surface2)', border: 0, borderRadius: 999, color: 'var(--text)', padding: '4px 8px', fontSize: 12, outline: 'none' }} />
            </label>
          );
          const lateEl = <button className={cls} onClick={() => setModal({ type: 'late' })}>⏰ Running late</button>;
          const reoptEl = <button className={cls} onClick={() => { if (view === 'month') setView('day'); setModal({ type: 'reopt' }); }}>✦ Re-optimize</button>;
          const syncEl = fb && <button className={cls} onClick={user ? () => setModal({ type: 'account' }) : signIn} title={user ? (user.email || 'Signed in') : 'Sign in to save your data in the cloud'} style={sync === 'error' || sync === 'toolarge' ? { borderColor: 'var(--danger)', color: 'var(--danger)' } : {}}>☁ {user ? (SYNC_LABEL[sync] || '').replace(' — will sync later', '') : 'Sign in to sync'}</button>;
          const undoEl = (
            <button className={cls} title="Undo last change (⌘/Ctrl+Z)" aria-label="Undo" onClick={undo} disabled={!canUndo}
              style={canUndo ? { color: 'var(--accent)', borderColor: 'var(--accent)', background: 'rgba(138,180,248,.10)' } : { opacity: .45, cursor: 'default' }}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z" /></svg>
              Undo
            </button>
          );
          const moreEl = (
            <div style={{ position: 'relative', flex: 'none' }}>
              <button className="icon-btn" title="More" onClick={() => setMoreOpen(o => !o)} aria-label="More" style={{ fontSize: 20 }}>⋯</button>
              {moreOpen && (
                <>
                  <div onMouseDown={() => setMoreOpen(false)} style={{ position: 'fixed', inset: 0, zIndex: 110 }} />
                  <div style={{ position: 'absolute', right: 0, top: 38, width: 250, maxWidth: '80vw', zIndex: 111, background: 'var(--surface2)', border: '1px solid var(--line-strong)', borderRadius: 12, padding: '6px 0', boxShadow: '0 12px 32px rgba(0,0,0,.45)' }}>
                    {moreItems.map((a, i) => a === '-' ? <div key={i} style={{ height: 1, background: 'var(--line-strong)', margin: '6px 0' }} /> :
                      <button key={i} className="menu-item" onClick={() => { setMoreOpen(false); a.run(); }}><span style={{ width: 16, textAlign: 'center' }}>{a.icon}</span>{a.label}</button>)}
                  </div>
                </>
              )}
            </div>
          );
          const pillsEl = (
            <div className="pills" style={narrow ? { display: 'flex' } : {}}>
              {['day', 'agenda', 'week', 'month'].map(v => <button key={v} className={'pill' + (view === v ? ' on' : '')} onClick={() => setView(v)}>{v[0].toUpperCase() + v.slice(1)}</button>)}
            </div>
          );
          if (narrow) return (
            <header style={{ display: 'flex', flexDirection: 'column', gap: 8, padding: '8px 12px 8px', borderBottom: '1px solid var(--line)' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                <button className="icon-btn" onClick={() => setSideOpen(true)} aria-label="Open menu" style={{ fontSize: 20 }}>☰</button>
                <div style={{ flex: 1, minWidth: 0, fontSize: 18, fontWeight: 500, letterSpacing: '-.01em', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', padding: '0 4px' }}>{compactTitle}</div>
                <button className="icon-btn" onClick={() => nav(-1)} aria-label="Previous" style={{ fontSize: 22 }}>‹</button>
                <button className="icon-btn" onClick={() => nav(1)} aria-label="Next" style={{ fontSize: 22 }}>›</button>
                <button className="btn sm" onClick={() => setCur(new Date())}>Today</button>
                {moreEl}
              </div>
              {(view === 'day' || view === 'agenda') && <DateStrip cur={cur} days={days} hidden={hidden} todayKey={todayKey} onPick={setCur} onShift={n => setCur(addDays(cur, n * 7))} />}
              <div className="hscroll" style={{ display: 'flex', gap: 6, margin: '0 -12px', padding: '0 12px' }}>
                {undoEl}{syncEl}{lateEl}{reoptEl}{hardStopEl}
              </div>
            </header>
          );
          return (
            <header style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 16px', borderBottom: '1px solid var(--line)', flexWrap: 'wrap' }}>
              <button className="btn" onClick={() => setCur(new Date())}>Today</button>
              <div style={{ display: 'flex' }}>
                <button className="icon-btn" onClick={() => nav(-1)} aria-label="Previous">‹</button>
                <button className="icon-btn" onClick={() => nav(1)} aria-label="Next">›</button>
              </div>
              <div style={{ fontSize: 20, fontWeight: 400, letterSpacing: '-.01em', marginRight: 'auto', minWidth: 0 }}>{title}</div>
              {hardStopEl}{lateEl}{reoptEl}{syncEl}{undoEl}{moreEl}{pillsEl}
            </header>
          );
        })()}

        {(view === 'day' || view === 'agenda') && <SummaryBar st={stats} hardStop={hardStop} compact={narrow} />}
        {carry.length > 0 && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 16px', background: 'rgba(138,180,248,.09)', borderBottom: '1px solid var(--line)', fontSize: 13, flexWrap: 'wrap' }}>
            <span>↪ <b>{carry.length}</b> unfinished task{carry.length === 1 ? '' : 's'} from earlier days ({carry.slice(0, 2).map(b => b.title).join(', ')}{carry.length > 2 ? '…' : ''})</span>
            <button className="btn primary" style={{ padding: '4px 12px', fontSize: 12 }} onClick={moveCarry}>Move to today</button>
            <button className="btn ghost" style={{ padding: '4px 12px', fontSize: 12 }} onClick={() => patchCfg({ carryDismissed: todayKey })}>Dismiss</button>
          </div>
        )}

        {view === 'agenda'
          ? <AgendaView dateKey={curKey} list={days[curKey] || []} hidden={hidden} nowMin={nowMin} isToday={curKey === todayKey} hardStop={hardStop} inbox={inbox}
              onToggleDone={toggleDone} onOpen={(d, id) => setSheet({ date: d, id })} onAddAt={openAdd} onScheduleInbox={t => scheduleInbox(t, { date: curKey, start: null })} />
          : view === 'month'
          ? <MonthView narrow={narrow} cur={cur} days={days} hidden={hidden} todayKey={todayKey} onOpenDay={d => { setCur(d); setView('day'); }} />
          : <TimeGrid narrow={narrow} touchBusy={touchDragging} onTap={(d, id) => setSheet({ date: d, id })} dates={dates} days={days} now={now} hardStop={hardStop} workStart={workStart} hidden={hidden} onToggleDone={toggleDone} onEditBuf={openBuf} isWeek={view === 'week'}
              onMove={moveBlock} onSetDay={setDay} onEdit={openEdit} onMenu={setMenu} onAddAt={openAdd}
              onOpenDay={d => { setCur(d); setView('day'); }} />}
        {narrow && <BottomNav view={view} onView={setView} />}
      </main>

      <input ref={jsonRef} type="file" accept=".json,application/json" style={{ display: 'none' }} onChange={e => { importJSON(e.target.files[0]); e.target.value = ''; }} />
      <input ref={icsRef} type="file" accept=".ics,text/calendar" style={{ display: 'none' }} onChange={e => { importICS(e.target.files[0]); e.target.value = ''; }} />

      {narrow && !modal && !sheet && !menu && !sideOpen && !syncChoice && !moreOpen && !inboxDrag && <button className="fab" aria-label="Add task" onClick={() => openAdd()}>+</button>}
      {sheetBlock && <ActionSheet block={sheetBlock} actions={sheetActions} onClose={() => setSheet(null)} />}
      {menu && <ContextMenu menu={menu} actions={menuActions} onClose={() => setMenu(null)} />}
      {modal && (modal.type === 'add' || modal.type === 'edit') && (
        <BlockModal mode={modal.type} initial={modal.initial} onClose={() => setModal(null)}
          onSave={(data, asTemplate) => {
            saveBlock(data, modal.orig || null);
            showCat(data.cat);
            if (asTemplate) setTasks(ts => [...ts, { id: uid(), name: data.title, dur: data.dur, cat: data.cat, pri: data.pri, color: data.color, uses: 0 }]);
            setModal(null);
          }}
          onDelete={() => { deleteBlock(modal.orig.date, modal.orig.id); setModal(null); flash('Block deleted', undo); }} />
      )}
      {modal && modal.type === 'buf' && (() => { const b = findBlock(modal.date, modal.id); return b ? <BufferModal block={b} onApply={v => setBuf(modal.date, modal.id, v)} onClose={() => setModal(null)} /> : null; })()}
      {modal && modal.type === 'finish' && (() => { const b = findBlock(modal.date, modal.id); return b ? <FinishModal block={b} nowMin={nowMin} isToday={modal.date === todayKey} onApply={(fm, pull) => applyFinish(modal.date, modal.id, fm, pull)} onClose={() => setModal(null)} /> : null; })()}
      {modal && modal.type === 'late' && <LateModal affected={lateAffected} nowMin={nowMin} onApply={applyLate} onClose={() => setModal(null)} />}
      {modal && modal.type === 'reopt' && <ReoptModal plan={reoptPlan} hardStop={hardStop} dateLabel={curKey === todayKey ? 'Today' : cur.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} onApply={applyReopt} onClose={() => setModal(null)} />}
      {modal && modal.type === 'insights' && <InsightsModal days={days} cur={cur} onClose={() => setModal(null)} />}
      {modal && modal.type === 'tpls' && <TemplatesModal tpls={tpls} dateLabel={curKey === todayKey ? 'today' : cur.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} dayCount={(days[curKey] || []).length} onSave={saveTpl} onApply={applyTpl} onDelete={id => setTpls(t => t.filter(x => x.id !== id))} onClose={() => setModal(null)} />}
      {modal && modal.type === 'settings' && <SettingsModal cfg={cfg} onChange={patchCfg} onClose={() => setModal(null)} />}
      {modal && modal.type === 'help' && <ShortcutsModal onClose={() => setModal(null)} />}
      {modal && modal.type === 'signin' && !user && <Modal title="Sign in to sync" onClose={() => setModal(null)} width={400}><div style={{ color: 'var(--muted)', fontSize: 13, textAlign: 'center', marginBottom: 16 }}>Save your calendar to your account and use it on every device.</div><SignInOptions onProvider={signInProvider} onEmail={emailAuth} onReset={resetPw} /></Modal>}
      {modal && modal.type === 'account' && user && <AccountModal user={user} status={sync} onSyncNow={syncNow} onSignOut={signOut} onClose={() => setModal(null)} />}
      {syncChoice && <SyncChoiceModal onChoose={resolveChoice} />}
      {fb && authReady && !user && !welcomed && <WelcomeScreen onProvider={signInProvider} onEmail={emailAuth} onReset={resetPw} onSkip={skipWelcome} />}

      {focusBlock && <FocusBar block={focusBlock} dateKey={settings.focus.date} left={narrow ? 12 : 280}
        onFinish={() => setModal({ type: 'finish', date: settings.focus.date, id: settings.focus.id })}
        onExtend={m => overrun(settings.focus.date, settings.focus.id, m)} onStop={() => patchCfg({ focus: null })} />}

      {inboxDrag && (
        <div style={{ position: 'fixed', left: inboxDrag.touch ? Math.max(8, Math.min(inboxDrag.x - 40, window.innerWidth - 230)) : inboxDrag.x + 14, top: inboxDrag.touch ? inboxDrag.y - 78 : inboxDrag.y + 14, zIndex: 300, pointerEvents: 'none', background: inboxDrag.t.color + 'cc', color: '#101114', borderRadius: 8, padding: '5px 10px', fontSize: 12, fontWeight: 500, boxShadow: '0 6px 18px rgba(0,0,0,.4)' }}>
          {inboxDrag.t.title}
          <span className="mono" style={{ marginLeft: 8, opacity: .8 }}>{inboxDrag.tgt ? (inboxDrag.tgt.start != null ? fmtRange(inboxDrag.tgt.start, inboxDrag.tgt.start + inboxDrag.t.dur) : 'add to day') : 'drop on calendar'}</span>
        </div>
      )}

      {toast && (
        <div style={{ position: 'fixed', bottom: 'calc(24px + env(safe-area-inset-bottom))', left: '50%', transform: 'translateX(-50%)', maxWidth: 'calc(100vw - 24px)', background: '#e8eaed', color: '#202124', borderRadius: 10, padding: '10px 16px', fontSize: 13, display: 'flex', gap: 14, alignItems: 'center', zIndex: 200, boxShadow: '0 8px 24px rgba(0,0,0,.5)', animation: 'pop .14s ease-out' }}>
          {toast.msg}
          {toast.undo && <button onClick={() => { toast.undo(); }} style={{ background: 'transparent', border: 0, color: '#1a56c4', fontWeight: 700, padding: 0 }}>Undo</button>}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
