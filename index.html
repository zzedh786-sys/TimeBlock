// Pushes every block that starts within the anchor's span down, cascading until a block isn't touched.

async function gz(str) { return new Uint8Array(await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()); }
async function gunz(bytes) { return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); }
async function encodeBundle(bundle) {
  const json = JSON.stringify(bundle);
  if (window.CompressionStream) { try { return { gz: firebase.firestore.Blob.fromUint8Array(await gz(json)) }; } catch (e) {} }
  return { json };
}
async function decodeBundle(d) {
  const o = JSON.parse(d.gz ? await gunz(d.gz.toUint8Array()) : (d.json || '{}'));
  return { v: 1, days: o.days || {}, tasks: o.tasks || [], inbox: o.inbox || [], tpls: o.tpls || [], settings: o.settings || {} };
}
const hasData = b => Object.values(b.days || {}).some(l => l.length) || (b.inbox || []).length > 0 || (b.tpls || []).length > 0;
function mergeBundles(local, remote) {
  const union = (mine, theirs) => { const m = new Map(); [...(theirs || []), ...(mine || [])].forEach(i => { if (!m.has(i.id)) m.set(i.id, i); }); return [...m.values()]; };
  const days = {};
  new Set([...Object.keys(local.days || {}), ...Object.keys(remote.days || {})]).forEach(k => { days[k] = union((local.days || {})[k], (remote.days || {})[k]).sort(byStart); });
  return { v: 1, days, tasks: union(local.tasks, remote.tasks), inbox: union(local.inbox, remote.inbox), tpls: union(local.tpls, remote.tpls), settings: { ...local.settings, ...remote.settings } };
}

/* ───────────── energy gradient ───────────── */
const PEAK = 'rgba(129,201,149,0.11)', DIP = 'rgba(126,134,200,0.12)', CLR = 'rgba(0,0,0,0)';
const pct = h => (h / 24 * 100).toFixed(2) + '%';
const ENERGY = `linear-gradient(to bottom, ${CLR} ${pct(6)}, ${PEAK} ${pct(9)}, ${PEAK} ${pct(12)}, ${CLR} ${pct(13.5)}, ${DIP} ${pct(14.25)}, ${DIP} ${pct(15.75)}, ${CLR} ${pct(17.5)})`;
const GRID_BG = `repeating-linear-gradient(to bottom, var(--gl1) 0 1px, transparent 1px ${HOUR_PX}px), repeating-linear-gradient(to bottom, var(--gl2) 0 1px, transparent 1px ${HOUR_PX / 4}px)`;

/* ───────────── small UI pieces ───────────── */
function Modal({ title, onClose, children, width = 440 }) {
  useEffect(() => {
    const h = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);
  return (
    <div className="modal-bg" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}
      style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,.6)', display: 'grid', placeItems: 'center', zIndex: 100, padding: 16 }}>
      <div className="modal-panel" style={{ width, maxWidth: '100%', maxHeight: '92vh', overflow: 'auto', background: 'var(--surface)', border: '1px solid var(--line-strong)', borderRadius: 16, boxShadow: '0 24px 60px rgba(0,0,0,.6)', animation: 'pop .14s ease-out' }}>
        <div style={{ display: 'flex', alignItems: 'center', padding: '16px 20px 6px' }}>
          <div style={{ fontSize: 18, fontWeight: 500, flex: 1 }}>{title}</div>
          <button className="icon-btn" onClick={onClose} aria-label="Close">✕</button>
        </div>
        <div className="modal-body" style={{ padding: '8px 20px 20px' }}>{children}</div>
      </div>
    </div>
  );
}

function BlockModal({ mode, initial, onSave, onDelete, onClose }) {
  const [f, setF] = useState(initial);
  const [colorTouched, setColorTouched] = useState(mode === 'edit');
  const [confirmDel, setConfirmDel] = useState(false);
  const [asTemplate, setAsTemplate] = useState(false);
  const [newSub, setNewSub] = useState('');
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const addSub = () => { const t = newSub.trim(); if (t) { set('subs', [...(f.subs || []), { id: uid(), t, d: false }]); setNewSub(''); } };
  const submit = e => {
    e && e.preventDefault();
    const dur = clamp(Math.round(Number(f.dur)) || 1, 1, 1440);
    const start = clamp(fromHHMM(f.time), 0, 1440 - dur);
    const subs = [...(f.subs || [])]; const pending = newSub.trim();
    if (pending) subs.push({ id: uid(), t: pending, d: false });
    onSave({ ...f, title: f.title.trim() || 'Untitled', dur, start, subs, buf: clamp(Math.round(Number(f.buf)) || 0, 0, 240) }, asTemplate);
  };
  return (
    <Modal title={mode === 'add' ? 'Add block' : 'Edit block'} onClose={onClose}>
      <form onSubmit={submit}>
        <div style={{ marginBottom: 14 }}>
          <label className="lbl">Task name</label>
          <input className="field" autoFocus value={f.title} onChange={e => set('title', e.target.value)} placeholder="What are you working on?" />
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0, 1.3fr) minmax(0, 1fr)', gap: 10, marginBottom: 14 }}>
          <div><label className="lbl">Date</label><input type="date" className="field" value={f.date} onChange={e => e.target.value && set('date', e.target.value)} /></div>
          <div><label className="lbl">Start</label><input type="time" className="field" value={f.time} onChange={e => set('time', e.target.value)} /></div>
        </div>
        <label className="lbl">Duration (any length up to 24h)</label>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8, flexWrap: 'wrap' }}>
          <input type="number" min="0" max="24" className="field mono" style={{ width: 80 }} value={Math.floor((Number(f.dur) || 0) / 60)}
            onChange={e => set('dur', clamp((parseInt(e.target.value, 10) || 0) * 60 + (Number(f.dur) || 0) % 60, 1, 1440))} />
          <span style={{ color: 'var(--muted)', fontSize: 13 }}>h</span>
          <input type="number" min="0" max="59" className="field mono" style={{ width: 80 }} value={(Number(f.dur) || 0) % 60}
            onChange={e => set('dur', clamp(Math.floor((Number(f.dur) || 0) / 60) * 60 + clamp(parseInt(e.target.value, 10) || 0, 0, 59), 1, 1440))} />

          <span className="mono" style={{ marginLeft: 'auto', fontSize: 12, color: 'var(--faint)', whiteSpace: 'nowrap' }}>{Number(f.dur) || 0} min total</span>
        </div>

        </div>
        <div style={{ marginBottom: 14 }}>
          <label className="lbl">Transition buffer after this task (optional)</label>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
            {[0, 5, 10, 15, 30].map(m => <button type="button" key={m} className={'chip' + ((Number(f.buf) || 0) === m ? ' on' : '')} onClick={() => set('buf', m)}>{m ? m + 'm' : 'None'}</button>)}

          </div>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0, 1fr) minmax(0, 1fr)', gap: 10, marginBottom: 14 }}>
          <div>
            <label className="lbl">Category</label>
            <select className="field" value={f.cat} onChange={e => { set('cat', e.target.value); if (!colorTouched) set('color', CATS[e.target.value]); }}>
              {Object.keys(CATS).map(c => <option key={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label className="lbl">Priority</label>
            <select className="field" value={f.pri} onChange={e => set('pri', e.target.value)}>
              {Object.entries(PRI).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </div>
        </div>
        <div style={{ marginBottom: 14 }}>
          <label className="lbl">Color</label>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            {SWATCHES.map(c => (
              <button type="button" key={c} aria-label={c} onClick={() => { set('color', c); setColorTouched(true); }}
                style={{ width: 26, height: 26, borderRadius: '50%', background: c, border: f.color === c ? '2px solid var(--text)' : '2px solid transparent', outline: f.color === c ? '2px solid ' + c : 'none', outlineOffset: 1, padding: 0 }} />
            ))}

        </div>
        <div style={{ marginBottom: 14 }}>
          <label className="lbl">Status</label>
          <div className="pills">
            <button type="button" className={'pill' + (f.status === 'confirmed' ? ' on' : '')} onClick={() => set('status', 'confirmed')}>Confirmed</button>
            <button type="button" className={'pill' + (f.status === 'tentative' ? ' on' : '')} onClick={() => set('status', 'tentative')}>Tentative</button>

        </div>
        <div style={{ marginBottom: 14 }}>
          <label className="lbl">Repeat</label>
          <select className="field" value={f.rec} onChange={e => set('rec', e.target.value)}>
            {Object.entries(RECUR).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
          </select>
          {mode === 'edit' && f.rec !== f.recInit && <div style={{ fontSize: 12, color: 'var(--faint)', marginTop: 5 }}>{f.recInit !== 'none' ? 'Future repeats of this task will be replaced' : 'Repeats will be created from this date onward'}{f.rec === 'none' ? ' — none will remain.' : '.'}</div>}
        </div>
        {mode === 'edit' && f.isSeries && f.rec === f.recInit && (
          <label style={{ display: 'flex', gap: 8, alignItems: 'center', fontSize: 13, color: 'var(--muted)', marginBottom: 14 }}>
            <input type="checkbox" checked={!!f.applyFuture} onChange={e => set('applyFuture', e.target.checked)} /> ↻ Apply these changes to this and all future occurrences
          </label>
        )}
        <div style={{ marginBottom: 14 }}>
          <label className="lbl">Notes</label>
          <textarea className="field" rows={2} value={f.notes || ''} onChange={e => set('notes', e.target.value)} placeholder="Links, context, next steps…" style={{ resize: 'vertical' }} />
        </div>
        <div style={{ marginBottom: 16 }}>
          <label className="lbl">Sub-tasks</label>
          {(f.subs || []).map(st => (
            <div key={st.id} style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>

          <label style={{ display: 'flex', gap: 8, alignItems: 'center', fontSize: 13, color: 'var(--muted)', marginBottom: 16 }}>

          </label>

        <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
          <button type="button" className="btn ghost" onClick={onClose}>Cancel</button>
          <button type="submit" className="btn primary">{mode === 'add' ? 'Add block' : 'Save changes'}</button>
        </div>
        {mode === 'edit' && (
          <div style={{ marginTop: 20, border: '1px solid rgba(242,139,130,.35)', borderRadius: 12, padding: '12px 14px', display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13, fontWeight: 500, color: 'var(--danger)' }}>Delete zone</div>

            </div>
            {confirmDel

      </form>
    </Modal>
  );

function BufferModal({ block, onApply, onClose }) {
  const [mins, setMins] = useState(block.buf || 15);
  const [custom, setCustom] = useState('');
  const val = custom !== '' ? clamp(parseInt(custom, 10) || 0, 0, 240) : mins;
  return (
    <Modal title="Transition buffer" onClose={onClose} width={400}>
      <div style={{ color: 'var(--muted)', fontSize: 13, marginBottom: 14 }}>Reserve travel, setup or reset time after “{block.title}”. The next task moves later if it's in the way.</div>
      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 12 }}>
        {[5, 10, 15, 20, 30, 45, 60].map(m => <button key={m} className={'chip' + (custom === '' && mins === m ? ' on' : '')} onClick={() => { setMins(m); setCustom(''); }}>{m}m</button>)}
      </div>
      <label className="lbl">Custom (minutes)</label>
      <input className="field" type="number" min="1" max="240" placeholder="e.g. 25" value={custom} onChange={e => setCustom(e.target.value)} style={{ marginBottom: 16 }} />
      <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
        {block.buf > 0 && <button className="btn danger" style={{ marginRight: 'auto' }} onClick={() => onApply(0)}>Remove buffer</button>}
        <button className="btn ghost" onClick={onClose}>Cancel</button>
        <button className="btn primary" disabled={!val} style={{ opacity: val ? 1 : .5 }} onClick={() => onApply(val)}>{block.buf > 0 ? 'Update' : 'Add'} {val || 0} min</button>

function LateModal({ affected, nowMin, onApply, onClose }) {
  const [mins, setMins] = useState(15);
  const [custom, setCustom] = useState('');
  const delay = custom !== '' ? Math.max(0, parseInt(custom, 10) || 0) : mins;
  return (
    <Modal title="Running late" onClose={onClose}>
      <div style={{ color: 'var(--muted)', fontSize: 13, marginBottom: 14 }}>How long are you delayed? Every block from {fmtT(nowMin)} onward will move forward by exactly that amount.</div>
      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 12 }}>
        {[5, 10, 15, 20, 30, 45, 60].map(m => <button key={m} className={'chip' + (custom === '' && mins === m ? ' on' : '')} onClick={() => { setMins(m); setCustom(''); }}>{m}m</button>)}
      </div>
      <label className="lbl">Custom (minutes)</label>
      <input className="field" type="number" min="1" placeholder="e.g. 25" value={custom} onChange={e => setCustom(e.target.value)} style={{ marginBottom: 16 }} />
      <div style={{ background: 'var(--surface2)', borderRadius: 12, padding: '12px 14px', marginBottom: 16 }}>
        <div style={{ fontWeight: 500, marginBottom: 6 }}>
          {affected.length === 0 ? 'No upcoming tasks today to push.' : <><span className="mono" style={{ color: 'var(--warn)' }}>{affected.length}</span> task{affected.length === 1 ? '' : 's'} will shift by <span className="mono" style={{ color: 'var(--warn)' }}>{delay}m</span></>}
        </div>
        {affected.slice(0, 5).map(b => (
          <div key={b.id} style={{ fontSize: 12, color: 'var(--muted)', display: 'flex', gap: 8, padding: '2px 0' }}>
            <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{b.title}</span>
            <span className="mono">{fmtT(b.start)} → {fmtT(Math.min(b.start + delay, 1440 - b.dur))}</span>
          </div>
        ))}
        {affected.length > 5 && <div style={{ fontSize: 12, color: 'var(--faint)' }}>+{affected.length - 5} more</div>}
      </div>
      <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
        <button className="btn ghost" onClick={onClose}>Cancel</button>
        <button className="btn primary" disabled={!delay || !affected.length} style={{ opacity: !delay || !affected.length ? .5 : 1 }} onClick={() => onApply(delay)}>Push {delay || 0} min</button>
      </div>
    </Modal>
  );
}

function ContextMenu({ menu, onClose, actions }) {
  const ref = useRef();
  useEffect(() => {
    const down = e => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    const key = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('mousedown', down); window.addEventListener('keydown', key);
    window.addEventListener('blur', onClose); window.addEventListener('resize', onClose);
    return () => { window.removeEventListener('mousedown', down); window.removeEventListener('keydown', key); window.removeEventListener('blur', onClose); window.removeEventListener('resize', onClose); };
  }, [onClose]);
  const x = Math.min(menu.x, window.innerWidth - 230), y = Math.min(menu.y, window.innerHeight - 230);
  return (
    <div ref={ref} style={{ position: 'fixed', left: x, top: y, width: 220, background: 'var(--surface2)', border: '1px solid var(--line-strong)', borderRadius: 12, padding: '6px 0', zIndex: 120, boxShadow: '0 12px 32px rgba(0,0,0,.55)', animation: 'pop .1s ease-out' }}>
      {actions.map((a, i) => a === '-'
        ? <div key={i} style={{ height: 1, background: 'var(--line-strong)', margin: '6px 0' }} />
        : <button key={i} className="menu-item" style={{ color: a.danger ? 'var(--danger)' : 'var(--text)' }} onClick={() => { onClose(); a.run(); }}><span style={{ width: 16, textAlign: 'center' }}>{a.icon}</span>{a.label}</button>)}
    </div>
  );
}

/* ───────────── finish early ───────────── */
function FinishModal({ block, nowMin, isToday, onApply, onClose }) {
  const plannedEnd = bEnd(block);
  const inProgress = isToday && nowMin > block.start && nowMin < plannedEnd;
  const [t, setT] = useState(toHHMM(inProgress ? nowMin : Math.max(block.start + 1, plannedEnd - 15)));
  const [pull, setPull] = useState(false);
  const fm = fromHHMM(t);
  const valid = fm > block.start && fm <= 1440 && t !== '00:00';
  const actual = fm - block.start, diff = block.dur - actual;
  const chips = [5, 10, 15, 30].map(m => ({ label: `−${m}m`, v: plannedEnd - m })).filter(c => c.v > block.start);
  return (
    <Modal title="Finish task" onClose={onClose} width={420}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
        <span style={{ width: 10, height: 34, borderRadius: 3, background: block.color }} />
        <div><div style={{ fontWeight: 500 }}>{block.title}</div><div className="mono" style={{ fontSize: 12, color: 'var(--muted)' }}>Planned {fmtRange(block.start, plannedEnd)} · {fmtDur(block.dur)}</div></div>
      </div>
      <label className="lbl">Actually finished at</label>
      <input type="time" className="field mono" autoFocus value={t} onChange={e => setT(e.target.value)} style={{ marginBottom: 10 }} />
      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 14 }}>
        {inProgress && <button className="chip" onClick={() => setT(toHHMM(nowMin))}>Now</button>}
        {chips.map(c => <button key={c.label} className="chip" onClick={() => setT(toHHMM(c.v))}>{c.label}</button>)}
      </div>
      <div style={{ background: 'var(--surface2)', borderRadius: 12, padding: '10px 14px', marginBottom: 12, fontSize: 13 }}>
        {!valid ? <span style={{ color: 'var(--danger)' }}>Pick a time after the start ({fmtT(block.start)}).</span>
          : diff > 0 ? <>Block shrinks to <b className="mono">{fmtRange(block.start, fm)}</b> · <span style={{ color: '#81c995' }}>you saved {fmtDur(diff)}</span></>
          : diff < 0 ? <>Ran over by <b>{fmtDur(-diff)}</b> · later blocks will shift down</>
          : <>Finished right on time.</>}
      </div>
      {valid && diff > 0 && (
        <label style={{ display: 'flex', gap: 8, alignItems: 'center', fontSize: 13, color: 'var(--muted)', marginBottom: 16 }}>
          <input type="checkbox" checked={pull} onChange={e => setPull(e.target.checked)} /> Pull back-to-back tasks after it earlier
        </label>
      )}
      <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
        <button className="btn ghost" onClick={onClose}>Cancel</button>
        <button className="btn primary" disabled={!valid} style={{ opacity: valid ? 1 : .5 }} onClick={() => onApply(fm, pull)}>Mark finished</button>
      </div>
    </Modal>
  );
}

/* ───────────── focus timer ───────────── */
function FocusBar({ block, dateKey, left, onFinish, onExtend, onStop }) {
  const [t, setT] = useState(Date.now());
  useEffect(() => { const i = setInterval(() => setT(Date.now()), 1000); return () => clearInterval(i); }, []);
  const d = new Date(t), nowS = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
  const startS = block.start * 60, endS = bEnd(block) * 60, same = dkey(d) === dateKey;
  const before = same && nowS < startS, secs = before ? startS - nowS : endS - nowS, over = same && secs < 0;
  const a = Math.abs(secs), fmt = `${a >= 3600 ? Math.floor(a / 3600) + ':' : ''}${pad(Math.floor(a % 3600 / 60))}:${pad(a % 60)}`;
  const prog = same ? clamp((nowS - startS) / Math.max(1, endS - startS), 0, 1) : 0;
  return (
    <div style={{ position: 'fixed', bottom: 20, left, zIndex: 90, width: 'min(300px, calc(100vw - 24px))', background: 'var(--surface2)', border: `1px solid ${over ? 'var(--warn)' : 'var(--line-strong)'}`, borderRadius: 14, padding: '12px 14px', boxShadow: '0 12px 32px rgba(0,0,0,.45)' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <span style={{ width: 8, height: 8, borderRadius: '50%', background: block.color }} />
        <div style={{ flex: 1, fontSize: 13, fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{block.title}</div>
        <button className="icon-btn" style={{ width: 24, height: 24, fontSize: 12 }} onClick={onStop} aria-label="Stop focus">✕</button>
      </div>
      {same ? (
        <>
          <div className="mono" style={{ fontSize: 30, letterSpacing: '-.02em', margin: '4px 0', color: over ? 'var(--warn)' : 'var(--text)' }}>{before ? '−' : over ? '+' : ''}{fmt}
            <span style={{ fontSize: 11, color: 'var(--muted)', marginLeft: 8, letterSpacing: 0 }}>{before ? 'until start' : over ? 'over time' : 'remaining'}</span></div>
          <div style={{ height: 4, borderRadius: 2, background: 'var(--surface3)', marginBottom: 10 }}><div style={{ height: 4, borderRadius: 2, width: `${prog * 100}%`, background: over ? 'var(--warn)' : block.color }} /></div>
          <div style={{ display: 'flex', gap: 6 }}>
            <button className="btn primary" style={{ padding: '5px 12px', fontSize: 12 }} onClick={onFinish}>Finish now</button>
            <button className="btn" style={{ padding: '5px 12px', fontSize: 12 }} onClick={() => onExtend(15)}>+15m</button>
          </div>
        </>
      ) : <div style={{ fontSize: 12, color: 'var(--muted)', marginTop: 6 }}>This block isn't scheduled for today.</div>}
    </div>
  );
}

/* ───────────── insights ───────────── */
function InsightsModal({ days, cur, onClose }) {
  const [range, setRange] = useState('week');
  const keys = useMemo(() => {
    if (range === 'day') return [dkey(cur)];
    if (range === 'week') return Array.from({ length: 7 }, (_, i) => dkey(addDays(startOfWeek(cur), i)));
    const n = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
    return Array.from({ length: n }, (_, i) => dkey(new Date(cur.getFullYear(), cur.getMonth(), i + 1)));
  }, [range, cur]);
  const blocks = keys.flatMap(k => days[k] || []);
  const total = blocks.reduce((a, b) => a + b.dur, 0);
  const byCat = {}; blocks.forEach(b => { byCat[b.cat] = (byCat[b.cat] || 0) + b.dur; });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const done = blocks.filter(b => b.done).length;
  const saved = blocks.reduce((a, b) => a + (b.plan && b.plan > b.dur ? b.plan - b.dur : 0), 0);
  const tent = blocks.filter(b => b.status === 'tentative').reduce((a, b) => a + b.dur, 0);
  const peak = blocks.reduce((a, b) => a + ovl(b, 540, 720), 0), dip = blocks.reduce((a, b) => a + ovl(b, 840, 960), 0);
  const deepPeak = blocks.filter(b => b.cat === 'Deep Work').reduce((a, b) => a + ovl(b, 540, 720), 0), deep = byCat['Deep Work'] || 0;
  const Kpi = ({ l, v, sub }) => <div style={{ background: 'var(--surface2)', borderRadius: 12, padding: '10px 12px' }}><div className="lbl" style={{ marginBottom: 2 }}>{l}</div><div className="mono" style={{ fontSize: 20 }}>{v}</div>{sub && <div style={{ fontSize: 11, color: 'var(--faint)' }}>{sub}</div>}</div>;
  return (
    <Modal title="Insights" onClose={onClose} width={520}>
      <div className="pills" style={{ marginBottom: 14 }}>{['day', 'week', 'month'].map(r => <button key={r} className={'pill' + (range === r ? ' on' : '')} onClick={() => setRange(r)}>{r[0].toUpperCase() + r.slice(1)}</button>)}</div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(105px, 1fr))', gap: 8, marginBottom: 16 }}>
        <Kpi l="Planned" v={fmtDur(total)} sub={`${blocks.length} blocks`} />
        <Kpi l="Done" v={`${done}/${blocks.length}`} sub={blocks.length ? Math.round(done / blocks.length * 100) + '%' : '–'} />
        <Kpi l="Saved" v={fmtDur(saved)} sub="finishing early" />
        <Kpi l="Tentative" v={fmtDur(tent)} sub={total ? Math.round(tent / total * 100) + '% of plan' : '–'} />
      </div>
      <div className="lbl">Time by category</div>
      <div style={{ marginBottom: 16 }}>
        {cats.length === 0 && <div style={{ color: 'var(--faint)', fontSize: 13 }}>Nothing scheduled in this range.</div>}
        {cats.map(([c, m]) => (
          <div key={c} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6, fontSize: 13 }}>
            <span style={{ width: 84 }}>{c}</span>
            <div style={{ flex: 1, height: 10, background: 'var(--surface3)', borderRadius: 5 }}><div style={{ width: `${m / cats[0][1] * 100}%`, height: 10, borderRadius: 5, background: CATS[c] }} /></div>
            <span className="mono" style={{ width: 64, textAlign: 'right', color: 'var(--muted)', fontSize: 12 }}>{fmtDur(m)}</span>
          </div>
        ))}
      </div>
      <div className="lbl">Energy fit</div>
      <div style={{ fontSize: 13, color: 'var(--muted)', lineHeight: 1.6 }}>
        <div>Peak window (9–12): <b className="mono" style={{ color: 'var(--text)' }}>{fmtDur(peak)}</b> planned{deep ? <> · <b className="mono" style={{ color: 'var(--text)' }}>{Math.round(deepPeak / deep * 100)}%</b> of your deep work lands here</> : null}</div>
        <div>Afternoon dip (2–4): <b className="mono" style={{ color: 'var(--text)' }}>{fmtDur(dip)}</b> planned</div>
      </div>
    </Modal>
  );
}

function SummaryBar({ st, hardStop, compact }) {

  const chip = (txt, warn, key) => <span key={key} style={{ flex: 'none', fontSize: compact ? 11.5 : 12, padding: compact ? '2px 9px' : '3px 10px', borderRadius: 999, border: `1px solid ${warn ? 'var(--warn)' : 'var(--line-strong)'}`, color: warn ? 'var(--warn)' : 'var(--muted)', whiteSpace: 'nowrap' }}>{txt}</span>;
  const r = 9, C = 2 * Math.PI * r, frac = st.done / st.count;
  return (
    <div className={compact ? 'hscroll' : ''} style={{ display: 'flex', gap: 8, alignItems: 'center', padding: compact ? '6px 12px' : '8px 16px', borderBottom: '1px solid var(--line)', flexWrap: compact ? 'nowrap' : 'wrap' }}>
      <svg style={{ flex: 'none' }} width="24" height="24" viewBox="0 0 24 24" aria-label="Progress"><circle cx="12" cy="12" r={r} fill="none" stroke="var(--surface3)" strokeWidth="3" /><circle cx="12" cy="12" r={r} fill="none" stroke="#81c995" strokeWidth="3" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C * (1 - frac)} transform="rotate(-90 12 12)" /></svg>
      {chip(`✓ ${st.done}/${st.count} done`, false, 'd')}
      {chip(`⏱ ${fmtDur(st.planned)} planned`, false, 'p')}
      {st.saved > 0 && chip(`⚡ ${fmtDur(st.saved)} saved by finishing early`, false, 's')}
      {st.over > 0 && chip(`⚠ ${st.over} overlapping block${st.over > 1 ? 's' : ''}`, true, 'o')}
      {st.deep > 360 && chip(`⚠ ${fmtDur(st.deep)} of deep work`, true, 'dw')}
      {st.late > 0 && chip(`⚠ ${st.late} run past ${fmtT(hardStop)}`, true, 'l')}
      {st.window > 0 && st.planned > st.window && chip(`⚠ ${fmtDur(st.planned)} planned in a ${fmtDur(st.window)} window`, true, 'w')}
    </div>
  );
}

      onTouchEnd={e => { const s0 = sw.current; sw.current = null; if (!s0) return; const p = e.changedTouches[0], dx = p.clientX - s0.x, dy = p.clientY - s0.y; if (Math.abs(dx) > 50 && Math.abs(dy) < Math.abs(dx) * .6) onShift(dx < 0 ? 1 : -1); }}>
      {cells.map(d => {

function AgendaView({ dateKey, list, hidden, nowMin, isToday, hardStop, inbox, onToggleDone, onOpen, onAddAt, onScheduleInbox }) {
  const blocks = list.filter(b => !hidden.includes(b.cat)).sort(byStart);
  const cur = isToday ? blocks.find(b => b.start <= nowMin && nowMin < bEnd(b) && !b.done) : null;
  const next = isToday ? blocks.find(b => b.start > nowMin && !b.done) : null;
  const rows = []; let cursor = null;
  blocks.forEach(b => {
    if (cursor !== null && b.start - cursor >= 30) rows.push({ gap: true, from: cursor, to: b.start });
    rows.push({ b }); cursor = Math.max(cursor === null ? 0 : cursor, bEnd(b) + (b.buf || 0));
  });
  if (blocks.length) { const at = rows.findIndex(r => (r.b ? r.b.start : r.from) >= hardStop); rows.splice(at < 0 ? rows.length : at, 0, { stop: true }); }
  const badge = (t, c) => <span className="mono" style={{ fontSize: 9.5, fontWeight: 700, letterSpacing: '.06em', background: c, color: '#101114', padding: '2px 6px', borderRadius: 5 }}>{t}</span>;
  return (
    <div data-day={dateKey} style={{ flex: 1, minHeight: 0, overflow: 'auto', padding: '12px 12px 120px' }}>
      {blocks.length === 0 && (
        <div style={{ textAlign: 'center', padding: '44px 20px', color: 'var(--muted)' }}>
          <div style={{ fontSize: 40, marginBottom: 8 }}>🗓</div>
          <div style={{ fontSize: 16, color: 'var(--text)', marginBottom: 4 }}>Nothing planned</div>
          <div style={{ fontSize: 13, marginBottom: 16 }}>Tap + to add a task, or pick from Pending tasks below.</div>
          <button className="btn primary" onClick={() => onAddAt(dateKey, isToday ? ceil15(nowMin) : 9 * 60)}>+ Add a task</button>
        </div>
      )}
      {rows.map((r, i) => {
        if (r.stop) return <div key={'s' + i} className="mono" style={{ display: 'flex', alignItems: 'center', gap: 8, color: 'var(--warn)', fontSize: 11, margin: '10px 4px' }}><span style={{ flex: 1, borderTop: '1px dashed var(--warn)' }} />⛔ HARD STOP {fmtT(hardStop)}<span style={{ flex: 1, borderTop: '1px dashed var(--warn)' }} /></div>;
        if (r.gap) return <button key={'g' + i} onClick={() => onAddAt(dateKey, r.from)} style={{ display: 'block', width: '100%', background: 'none', border: '1px dashed var(--line-strong)', borderRadius: 12, color: 'var(--faint)', padding: '10px', fontSize: 13, marginBottom: 8 }}>＋ Free {fmtDur(r.to - r.from)} · {fmtRange(r.from, r.to)}</button>;
        const b = r.b, tent = b.status === 'tentative', isNow = cur && cur.id === b.id;
        return (
          <div key={b.id} onClick={() => onOpen(dateKey, b.id)} style={{ display: 'flex', alignItems: 'stretch', gap: 12, marginBottom: 8, borderRadius: 14, background: isNow ? b.color + '2e' : 'var(--surface2)', border: tent ? `1.5px dashed ${b.color}` : `1px solid ${isNow ? b.color : 'var(--line)'}`, borderLeft: tent ? `1.5px dashed ${b.color}` : `5px solid ${b.color}`, opacity: b.done ? .6 : 1 }}>
            <div className="mono" style={{ width: 80, flex: 'none', padding: '12px 0 12px 12px', fontSize: 12, lineHeight: 1.5, whiteSpace: 'nowrap' }}>
              <div style={{ color: 'var(--text)' }}>{fmtT(b.start)}</div><div style={{ color: 'var(--faint)' }}>{fmtDur(b.dur)}</div>
            </div>
            <div style={{ flex: 1, minWidth: 0, padding: '11px 0' }}>
              <div style={{ fontSize: 15.5, fontWeight: 500, textDecoration: b.done ? 'line-through' : 'none', overflowWrap: 'anywhere' }}>{tent ? '? ' : ''}{b.title}</div>
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center', marginTop: 5, fontSize: 12, color: 'var(--muted)' }}>
                {isNow && badge('NOW', b.color)}{!isNow && next && next.id === b.id && badge('NEXT', 'var(--muted)')}
                <span>{b.cat}</span>{b.seriesId && <span title="Repeats">↻</span>}
                {b.subs && b.subs.length > 0 && <span className="mono">☑ {b.subs.filter(x => x.d).length}/{b.subs.length}</span>}
                {b.notes && <span>✎</span>}{b.overrun && badge('OVERRUN', 'var(--warn)')}{b.plan > b.dur && badge('−' + fmtDur(b.plan - b.dur), '#81c995')}
                {b.buf > 0 && <span className="mono" style={{ color: 'var(--faint)' }}>↔ {b.buf}m</span>}
              </div>
            </div>
            <button aria-label={b.done ? 'Mark not done' : 'Mark done'} onClick={e => { e.stopPropagation(); onToggleDone(dateKey, b.id); }} style={{ flex: 'none', width: 52, background: 'none', border: 0, display: 'grid', placeItems: 'center' }}>
              <span style={{ width: 26, height: 26, borderRadius: '50%', border: `2px solid ${b.color}`, background: b.done ? b.color : 'transparent', color: '#101114', fontWeight: 700, display: 'grid', placeItems: 'center', fontSize: 15 }}>{b.done ? '✓' : ''}</span>
            </button>
          </div>
        );
      })}
      {inbox.length > 0 && (
        <div style={{ marginTop: 22 }}>
          <div className="lbl" style={{ paddingLeft: 4 }}>Pending tasks</div>
          {inbox.map(t => (
            <div key={t.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 4px 10px 12px', marginBottom: 6, borderRadius: 12, background: 'var(--surface)', border: '1px solid var(--line)' }}>
              <span style={{ width: 10, height: 10, borderRadius: 3, background: t.color, flex: 'none' }} />
              <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 14, overflowWrap: 'anywhere' }}>{t.title}</div><div className="mono" style={{ fontSize: 11, color: 'var(--faint)' }}>{fmtDur(t.dur)} · {t.cat}</div></div>
              <button className="btn sm" onClick={() => onScheduleInbox(t)}>Schedule</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ───────────── time grid (day + week) ───────────── */
function TimeGrid({ narrow, touchBusy, onTap, dates, days, now, hardStop, workStart, hidden, onToggleDone, onEditBuf, onMove, onSetDay, onEdit, onMenu, onAddAt, onOpenDay, isWeek }) {
  const scroller = useRef();
  const colRefs = useRef({});
  const [ghost, setGhost] = useState(null);
  const [dragId, setDragId] = useState(null);
  const [preview, setPreview] = useState(null);
  const [offNow, setOffNow] = useState(0);
  const touchAt = useRef(0);
  const tapRef = useRef(null);
  const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  const todayKey = dkey(now);
  const firstKey = dkey(dates[0]);
  const hasToday = dates.some(d => dkey(d) === todayKey);

  useEffect(() => {
    if (!scroller.current) return;
    const focus = hasToday ? Math.max(0, nowMin / 60 - 1.5) : 7.5;
    scroller.current.scrollTop = focus * HOUR_PX;
  }, [isWeek, firstKey]);

  const checkNow = () => {
    const sc = scroller.current; if (!sc || !hasToday) { setOffNow(0); return; }
    const y = nowMin * PX_MIN + 70, top = sc.scrollTop, bottom = top + sc.clientHeight;
    setOffNow(y < top + 80 ? -1 : y > bottom - 20 ? 1 : 0);
  };
  useEffect(checkNow, [Math.floor(nowMin), hasToday, isWeek, firstKey]);
  const jumpNow = () => scroller.current && scroller.current.scrollTo({ top: Math.max(0, nowMin / 60 - 1.5) * HOUR_PX, behavior: 'smooth' });

  const startDrag = (e, b, date) => {
    if (e.button !== 0 || e.target.dataset.resize) return;
    e.preventDefault();
    const rect = colRefs.current[date].getBoundingClientRect();
    const grab = e.clientY - rect.top - b.start * PX_MIN;
    const sx = e.clientX, sy = e.clientY;
    let active = false, last = null;
    const move = ev => {
      if (!active) {
        if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 5) return;
        active = true; setDragId(b.id);
      }
      let tgt = date;
      for (const k in colRefs.current) {
        const el = colRefs.current[k]; if (!el) continue;
        const r = el.getBoundingClientRect();
        if (ev.clientX >= r.left && ev.clientX < r.right) { tgt = k; break; }
      }
      const r = colRefs.current[tgt].getBoundingClientRect();
      const s = clamp(Math.round((ev.clientY - r.top - grab) / PX_MIN / SLOT) * SLOT, 0, 1440 - b.dur);
      last = { date: tgt, start: s };
      setGhost({ ...last, dur: b.dur, title: b.title, color: b.color });
      const sc = scroller.current.getBoundingClientRect();
      if (ev.clientY < sc.top + 90) scroller.current.scrollTop -= 18;
      else if (ev.clientY > sc.bottom - 40) scroller.current.scrollTop += 18;
    };
    const up = () => {
      window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up);
      setGhost(null); setDragId(null);
      if (active && last && (last.date !== date || last.start !== b.start)) onMove(b.id, date, last.date, last.start);
    };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  };

  const startResize = (e, b, date) => {
    if (e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    let last = null;
    const move = ev => {
      const r = colRefs.current[date].getBoundingClientRect();
      const end = Math.round((ev.clientY - r.top) / PX_MIN / SLOT) * SLOT;
      const dur = clamp(end - b.start, SLOT, 1440 - b.start);
      const base = (days[date] || []).map(x => (x.id === b.id ? { ...x, dur } : x));
      last = normalize(waterfall(base, b.id));
      setPreview({ date, blocks: last });
      const sc = scroller.current.getBoundingClientRect();
      if (ev.clientY > sc.bottom - 40) scroller.current.scrollTop += 18;
    };
    const up = () => {
      window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up);
      setPreview(null);
      if (last) onSetDay(date, last);
    };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  };

  // Touch: tap a block → action sheet; press & hold → pick it up and move it; drag the bottom handle → resize.
  const startTouch = (e, b, date) => {
    if (e.touches.length !== 1) return;
    touchAt.current = Date.now();
    const el = e.currentTarget, p0 = e.touches[0], t0 = Date.now();
    let x = p0.clientX, y = p0.clientY;
    const sx = x, sy = y;
    const rect0 = colRefs.current[date].getBoundingClientRect();
    const grab = y - rect0.top - b.start * PX_MIN;
    let active = false, moved = false, last = null, timer = null, loop = null;
    const upd = () => {
      let tgt = date;
      for (const k in colRefs.current) { const c = colRefs.current[k]; if (!c) continue; const r = c.getBoundingClientRect(); if (x >= r.left && x < r.right) { tgt = k; break; } }
      const r = colRefs.current[tgt].getBoundingClientRect();
      last = { date: tgt, start: clamp(Math.round((y - r.top - grab) / PX_MIN / SLOT) * SLOT, 0, 1440 - b.dur) };
      setGhost({ ...last, dur: b.dur, title: b.title, color: b.color });
    };
    const cleanup = () => { clearTimeout(timer); clearInterval(loop); el.removeEventListener('touchmove', move); el.removeEventListener('touchend', end); el.removeEventListener('touchcancel', cancel); };
    function move(ev) {
      const p = ev.touches[0]; x = p.clientX; y = p.clientY;
      if (!active) { if (Math.abs(x - sx) + Math.abs(y - sy) > 10) { moved = true; cleanup(); } return; }
      ev.preventDefault(); upd();
    }
    function end(ev) {
      const was = active; cleanup();
      touchAt.current = Date.now();
      if (was) {
        if (ev.cancelable) ev.preventDefault();
        setGhost(null); setDragId(null);
        if (last && (last.date !== date || last.start !== b.start)) onMove(b.id, date, last.date, last.start);
        setTimeout(() => { touchBusy.current = false; }, 60);
      } else if (!moved && Date.now() - t0 < 500) { if (ev.cancelable) ev.preventDefault(); onTap(date, b.id); }
    }
    function cancel() { const was = active; cleanup(); if (was) { setGhost(null); setDragId(null); touchBusy.current = false; } }
    el.addEventListener('touchmove', move, { passive: false }); el.addEventListener('touchend', end); el.addEventListener('touchcancel', cancel);
    timer = setTimeout(() => {
      active = true; touchBusy.current = true; setDragId(b.id);
      if (navigator.vibrate) navigator.vibrate(15);
      upd();
      loop = setInterval(() => {
        const sc = scroller.current; if (!sc) return;
        const r = sc.getBoundingClientRect();
        if (y < r.top + 90) sc.scrollTop -= 12; else if (y > r.bottom - 60) sc.scrollTop += 12;
        upd();
      }, 30);
    }, 380);
  };
  const startTouchResize = (e, b, date) => {
    if (e.touches.length !== 1) return;
    e.stopPropagation(); touchAt.current = Date.now(); touchBusy.current = true;
    const el = e.currentTarget; let last = null;
    const move = ev => {
      ev.preventDefault();
      const y = ev.touches[0].clientY, r = colRefs.current[date].getBoundingClientRect();
      const dur = clamp(Math.round((y - r.top) / PX_MIN / SLOT) * SLOT - b.start, SLOT, 1440 - b.start);
      last = normalize(waterfall((days[date] || []).map(x => (x.id === b.id ? { ...x, dur } : x)), b.id));
      setPreview({ date, blocks: last });
      const sc = scroller.current.getBoundingClientRect();
      if (y > sc.bottom - 50) scroller.current.scrollTop += 14; else if (y < sc.top + 90) scroller.current.scrollTop -= 14;
    };
    const finish = ev => {
      el.removeEventListener('touchmove', move); el.removeEventListener('touchend', finish); el.removeEventListener('touchcancel', finish);
      setPreview(null); touchAt.current = Date.now();
      if (ev.type === 'touchend') { if (ev.cancelable) ev.preventDefault(); if (last) onSetDay(date, last); }
      setTimeout(() => { touchBusy.current = false; }, 60);
    };
    el.addEventListener('touchmove', move, { passive: false }); el.addEventListener('touchend', finish); el.addEventListener('touchcancel', finish);
  };

  const hours = Array.from({ length: 23 }, (_, i) => i + 1);
  const G = narrow ? 44 : GUTTER;
  const minW = isWeek ? G + 7 * (narrow ? 104 : 128) : 0;

  return (
    <div style={{ flex: 1, minHeight: 0, position: 'relative', display: 'flex', flexDirection: 'column' }}>
    <div ref={scroller} data-scroller="1" onScroll={checkNow} style={{ flex: 1, minHeight: 0, overflow: 'auto', position: 'relative', userSelect: 'none', WebkitUserSelect: 'none' }}>
      <div style={{ minWidth: minW }}>
        {/* sticky day headers */}
        <div style={{ position: 'sticky', top: 0, zIndex: 30, display: 'flex', background: 'var(--bg)', borderBottom: '1px solid var(--line-strong)' }}>
          <div style={{ width: G, flex: 'none', position: 'sticky', left: 0, background: 'var(--bg)', zIndex: 2 }} />
          {dates.map(d => {
            const k = dkey(d), isT = k === todayKey;
            return (
              <div key={k} onClick={() => onOpenDay(d)} style={{ flex: 1, minWidth: 0, padding: narrow ? '4px 0' : '8px 0 8px', textAlign: 'center', cursor: isWeek ? 'pointer' : 'default', borderLeft: '1px solid var(--line)', background: isT ? 'rgba(138,180,248,.07)' : 'transparent' }}>
                <div style={{ fontSize: 11, letterSpacing: '.08em', textTransform: 'uppercase', color: isT ? 'var(--accent)' : 'var(--muted)', fontWeight: 500 }}>{DOW[d.getDay()]}</div>
                <div style={{ width: narrow ? 30 : 36, height: narrow ? 30 : 36, margin: '2px auto 0', borderRadius: '50%', display: 'grid', placeItems: 'center', fontSize: narrow ? 16 : 20, background: isT ? 'var(--accent)' : 'transparent', color: isT ? 'var(--accent-ink)' : 'var(--text)', fontWeight: isT ? 700 : 400 }}>{d.getDate()}</div>
              </div>
            );
          })}
        </div>

        <div style={{ display: 'flex', position: 'relative', height: DAY_PX }}>
          {/* time gutter */}
          <div style={{ width: G, flex: 'none', position: 'sticky', left: 0, zIndex: 25, background: 'var(--bg)', height: DAY_PX }}>
            {hours.filter(h => !(hasToday && Math.abs(h * 60 - nowMin) < 14)).map(h => (
              <div key={h} className="mono" style={{ position: 'absolute', top: h * HOUR_PX - 7, right: narrow ? 5 : 10, fontSize: narrow ? 9.5 : 10.5, color: 'var(--faint)', letterSpacing: '.02em' }}>
                {h % 12 || 12} {h >= 12 ? 'pm' : 'am'}
              </div>
            ))}
            {hasToday && (
              <div className="mono" style={{ position: 'absolute', top: nowMin * PX_MIN - 9, right: 2, background: 'var(--now)', color: '#fff', fontSize: narrow ? 9 : 10, padding: '2px 4px', borderRadius: 4, zIndex: 3 }}>{fmtT(nowMin)}</div>
            )}
          </div>

          {dates.map(d => {
            const k = dkey(d), isT = k === todayKey;
            const allBlocks = preview && preview.date === k ? preview.blocks : (days[k] || []);
            const vis = b => !hidden.includes(b.cat);
            const blocks = allBlocks.filter(vis);
            const lanes = layoutLanes(blocks);
            const bufs = bufferSlots(allBlocks, vis);
            return (
              <div key={k} data-col={k} ref={el => { colRefs.current[k] = el; }}
                onDoubleClick={e => {
                  if (e.target !== e.currentTarget) return;
                  const r = e.currentTarget.getBoundingClientRect();
                  onAddAt(k, clamp(Math.floor((e.clientY - r.top) / PX_MIN / SLOT) * SLOT, 0, 1440 - SLOT));
                }}
                style={{ flex: 1, minWidth: 0, position: 'relative', height: DAY_PX, borderLeft: '1px solid var(--line)' }}>
                <div style={{ position: 'absolute', inset: 0, backgroundImage: GRID_BG, pointerEvents: 'none' }} />
                <div style={{ position: 'absolute', inset: 0, backgroundImage: ENERGY, pointerEvents: 'none' }} />
                {isT && <div style={{ position: 'absolute', inset: 0, background: 'rgba(138,180,248,.035)', pointerEvents: 'none' }} />}
                {workStart > 0 && <div style={{ position: 'absolute', left: 0, right: 0, top: 0, height: workStart * PX_MIN, background: 'var(--shade)', pointerEvents: 'none', zIndex: 2 }} />}
                {/* hard stop shading */}
                <div style={{ position: 'absolute', left: 0, right: 0, top: hardStop * PX_MIN, bottom: 0, background: 'var(--shade)', borderTop: '1px dashed var(--warn)', pointerEvents: 'none', zIndex: 2 }}>
                  <span className="mono" style={{ position: 'absolute', right: 6, top: 3, fontSize: 9.5, color: 'var(--warn)', opacity: .85 }}>HARD STOP {fmtT(hardStop)}</span>
                </div>

                {bufs.map(s => (
                  <div key={'buf' + s.id} title="Transition buffer · double-click to change" onDoubleClick={e => { e.stopPropagation(); onEditBuf(k, s.id); }}
                    style={{ position: 'absolute', left: 4, right: 4, top: s.start * PX_MIN + 1, height: Math.max(s.dur * PX_MIN - 2, 12), borderRadius: 6, background: 'repeating-linear-gradient(135deg, var(--strip) 0 6px, transparent 6px 12px)', border: '1px dashed var(--line-strong)', color: 'var(--muted)', fontSize: 10, display: 'flex', alignItems: 'center', justifyContent: 'center', letterSpacing: '.08em', textTransform: 'uppercase', overflow: 'hidden', cursor: 'pointer', zIndex: 3 }}>
                    {isWeek ? '↔' : `↔ transition · ${s.dur}m`}
                  </div>
                ))}

                {blocks.map(b => {
                  const ln = lanes.get(b.id) || { lane: 0, n: 1 };
                  const h = Math.max(b.dur * PX_MIN, 16);
                  const tent = b.status === 'tentative';
                  const past = isT && bEnd(b) < nowMin;
                  return (
                    <div key={b.id} className="blk"
                      onMouseDown={e => startDrag(e, b, k)}
                      onTouchStart={e => startTouch(e, b, k)}
                      onDoubleClick={e => { e.stopPropagation(); onEdit(k, b.id); }}
                      onContextMenu={e => { e.preventDefault(); if (Date.now() - touchAt.current < 1500) return; onMenu({ x: e.clientX, y: e.clientY, date: k, id: b.id }); }}
                      style={{
                        position: 'absolute', top: b.start * PX_MIN + 1, height: h - 2,
                        left: `calc(${ln.lane / ln.n * 100}% + 3px)`, width: `calc(${100 / ln.n}% - 6px)`,
                        background: tent ? b.color + '14' : b.color + '42',
                        border: tent ? `1.5px dashed ${b.color}` : `1px solid ${b.color}80`,
                        borderLeft: tent ? `1.5px dashed ${b.color}` : `4px solid ${b.color}`,
                        borderRadius: 8, padding: h < 40 ? '1px 8px' : '5px 8px', overflow: 'hidden', cursor: 'grab', zIndex: 5, WebkitTouchCallout: 'none',
                        opacity: dragId === b.id ? .3 : (b.done || past) ? .6 : 1,
                        display: 'flex', flexDirection: h < 44 ? 'row' : 'column', alignItems: h < 44 ? 'center' : 'stretch', gap: h < 44 ? 8 : 0,
                      }}>
                      <div style={{ fontSize: 12.5, fontWeight: 500, lineHeight: 1.25, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', minWidth: 0, paddingRight: narrow ? 30 : 20 }}>
                        {tent && <span style={{ color: b.color }}>? </span>}
                        {b.seriesId && <span title="Repeats" style={{ color: b.color }}>↻ </span>}
                        <span style={{ textDecoration: b.done ? 'line-through' : 'none' }}>{b.title}</span>
                        {b.overrun && <span className="mono" style={{ marginLeft: 6, fontSize: 9.5, background: 'var(--warn)', color: '#2a2100', padding: '1px 4px', borderRadius: 4 }}>OVERRUN</span>}
                        {b.plan > b.dur && <span className="mono" style={{ marginLeft: 6, fontSize: 9.5, background: '#81c995', color: '#0d2a14', padding: '1px 4px', borderRadius: 4 }}>−{fmtDur(b.plan - b.dur)}</span>}
                        {b.subs && b.subs.length > 0 && <span className="mono" style={{ marginLeft: 6, fontSize: 10, color: 'var(--muted)' }}>☑ {b.subs.filter(x => x.d).length}/{b.subs.length}</span>}
                        {b.notes && <span title="Has notes" style={{ marginLeft: 6, fontSize: 10, color: 'var(--muted)' }}>✎</span>}
                      </div>
                      <div role="checkbox" aria-checked={!!b.done} aria-label="Mark done" title={b.done ? 'Done' : 'Mark done'}
                        onMouseDown={e => e.stopPropagation()} onDoubleClick={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); onToggleDone(k, b.id); }}
                        onTouchStart={e => { e.stopPropagation(); touchAt.current = Date.now(); const p = e.touches[0]; tapRef.current = { x: p.clientX, y: p.clientY }; }}
                        onTouchEnd={e => { e.stopPropagation(); const t0 = tapRef.current, p = e.changedTouches[0]; if (t0 && Math.abs(p.clientX - t0.x) + Math.abs(p.clientY - t0.y) < 12) { e.preventDefault(); onToggleDone(k, b.id); } }}
                        style={{ position: 'absolute', top: 0, right: 0, width: narrow ? Math.min(44, Math.max(26, h - 26)) : 24, height: narrow ? Math.min(44, Math.max(26, h - 26)) : 24, display: 'grid', placeItems: 'center', cursor: 'pointer', zIndex: 2 }}>
                        <div style={{ width: narrow ? 20 : 15, height: narrow ? 20 : 15, borderRadius: '50%', border: `1.5px solid ${b.color}`, background: b.done ? b.color : 'transparent', color: '#101114', fontSize: narrow ? 12 : 10, fontWeight: 700, display: 'grid', placeItems: 'center', lineHeight: 1 }}>{b.done ? '✓' : ''}</div>
                      </div>
                      <div className="mono" style={{ fontSize: 10.5, color: b.color, whiteSpace: 'nowrap', flex: 'none', opacity: .95 }}>
                        {fmtRange(b.start, bEnd(b))}{h >= 60 && !isWeek ? ` · ${b.cat}` : ''}
                      </div>
                      {h >= 70 && !isWeek && <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', marginTop: 2 }}>{PRI[b.pri].mark} {PRI[b.pri].label.toLowerCase()}</div>}
                      <div data-resize="1" onMouseDown={e => startResize(e, b, k)} onTouchStart={e => startTouchResize(e, b, k)} style={{ position: 'absolute', left: 0, right: 0, bottom: 0, height: narrow ? 22 : 9, cursor: 'ns-resize', display: 'flex', justifyContent: 'center', alignItems: 'flex-end', touchAction: 'none' }}>
                        <div style={{ width: narrow ? 34 : 22, height: narrow ? 4 : 3, borderRadius: 2, background: b.color, opacity: narrow ? .8 : .55, marginBottom: narrow ? 4 : 1, pointerEvents: 'none' }} />
                      </div>
                    </div>
                  );
                })}

                {ghost && ghost.date === k && (
                  <div style={{ position: 'absolute', left: 3, right: 3, top: ghost.start * PX_MIN, height: ghost.dur * PX_MIN, border: `2px dashed ${ghost.color}`, background: ghost.color + '22', borderRadius: 8, zIndex: 20, pointerEvents: 'none', padding: '4px 8px' }}>
                    <div className="mono" style={{ fontSize: 11, fontWeight: 500, color: ghost.color, background: 'var(--bg)', display: 'inline-block', padding: '1px 6px', borderRadius: 4 }}>{fmtRange(ghost.start, ghost.start + ghost.dur)}</div>
                  </div>
                )}

                {isT && (
                  <div style={{ position: 'absolute', left: 0, right: 0, top: nowMin * PX_MIN - 1, height: 2, background: 'var(--now)', zIndex: 15, pointerEvents: 'none', boxShadow: '0 0 8px rgba(234,67,53,.6)' }}>
                    <div style={{ position: 'absolute', left: -6, top: -5, width: 12, height: 12, borderRadius: '50%', background: 'var(--now)' }} />
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
    {offNow !== 0 && <button onClick={jumpNow} className="btn sm" style={{ position: 'absolute', left: 12, bottom: 14, zIndex: 40, background: 'var(--now)', color: '#fff', borderColor: 'transparent', boxShadow: '0 4px 14px rgba(0,0,0,.4)' }}>{offNow < 0 ? '↑' : '↓'} Now</button>}
    </div>
  );
}

/* ───────────── month view ───────────── */
function MonthView({ narrow, cur, days, hidden, todayKey, onOpenDay }) {
  const first = startOfWeek(new Date(cur.getFullYear(), cur.getMonth(), 1));
  const cells = Array.from({ length: 42 }, (_, i) => addDays(first, i));
  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', borderBottom: '1px solid var(--line-strong)' }}>
        {DOW.map(d => <div key={d} style={{ padding: '10px 0', textAlign: 'center', fontSize: 11, letterSpacing: '.08em', textTransform: 'uppercase', color: 'var(--muted)' }}>{d}</div>)}
      </div>
      <div style={{ flex: 1, display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gridTemplateRows: 'repeat(6, minmax(0, 1fr))', minHeight: 0 }}>
        {cells.map(d => {
          const k = dkey(d), list = (days[k] || []).filter(b => !hidden.includes(b.cat)).sort(byStart), isT = k === todayKey, inMonth = d.getMonth() === cur.getMonth();
          return (
            <div key={k} data-day={k} className="cell" onClick={() => onOpenDay(d)} style={{ borderRight: '1px solid var(--line)', borderBottom: '1px solid var(--line)', padding: narrow ? '3px 2px' : '4px 5px', cursor: 'pointer', overflow: 'hidden', opacity: inMonth ? 1 : .45, minWidth: 0 }}>
              <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 2 }}>
                <span style={{ width: 24, height: 24, borderRadius: '50%', display: 'grid', placeItems: 'center', fontSize: 12, fontWeight: isT ? 700 : 400, background: isT ? 'var(--accent)' : 'transparent', color: isT ? 'var(--accent-ink)' : 'var(--text)' }}>{d.getDate()}</span>
              </div>
              {narrow ? (
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 3, justifyContent: 'center', padding: '2px 1px' }}>
                  {list.slice(0, 8).map(b => <span key={b.id} style={{ width: 7, height: 7, borderRadius: '50%', background: b.status === 'tentative' ? 'transparent' : b.color, border: `1.5px solid ${b.color}`, opacity: b.done ? .4 : 1 }} />)}
                  {list.length > 8 && <span style={{ fontSize: 9, color: 'var(--muted)' }}>+{list.length - 8}</span>}
                </div>
              ) : list.slice(0, 3).map(b => (
                <div key={b.id} style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 11, marginBottom: 2, padding: '1px 5px', borderRadius: 4, background: b.status === 'tentative' ? 'transparent' : b.color + '30', border: b.status === 'tentative' ? `1px dashed ${b.color}` : '1px solid transparent', whiteSpace: 'nowrap', overflow: 'hidden' }}>
                  <span style={{ width: 6, height: 6, borderRadius: '50%', background: b.color, flex: 'none' }} />
                  <span className="mono" style={{ color: 'var(--muted)', fontSize: 9.5, flex: 'none' }}>{fmtT(b.start).replace(' ', '')}</span>
                  <span style={{ overflow: 'hidden', textOverflow: 'ellipsis' }}>{b.title}</span>
                </div>
              ))}
              {!narrow && list.length > 3 && <div style={{ fontSize: 11, color: 'var(--muted)', paddingLeft: 5 }}>+{list.length - 3} more</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ───────────── app ───────────── */
function App() {
  const [days, setDays] = useState(() => load(KEYS.days, () => ({})));
  const [tasks, setTasks] = useState(() => load(KEYS.tasks, sampleTasks));
  const [settings, setSettings] = useState(() => load(KEYS.settings, () => ({})));
  const [inbox, setInbox] = useState(() => load(KEYS.inbox, () => []));
  const [tpls, setTpls] = useState(() => load(KEYS.tpls, () => []));
  const [view, setView] = useState('day');
  const [cur, setCur] = useState(() => new Date());
  const [now, setNow] = useState(() => new Date());
  const [modal, setModal] = useState(null);
  const [menu, setMenu] = useState(null);
  const [moreOpen, setMoreOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [inboxDrag, setInboxDrag] = useState(null);
  const [inForm, setInForm] = useState({ title: '', dur: 30, cat: 'Admin' });
  const [narrow, setNarrow] = useState(() => window.innerWidth < 860);
  const [sideOpen, setSideOpen] = useState(false);
  const daysRef = useRef(days); daysRef.current = days;
  const inboxRef = useRef(inbox); inboxRef.current = inbox;
  const hist = useRef([]);
  const toastTimer = useRef();
  const jsonRef = useRef(), icsRef = useRef();
  const [user, setUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [welcomed, setWelcomed] = useState(() => lsGet('tb.welcomed.v1') === '1');
  const [canUndo, setCanUndo] = useState(false);
  const [sheet, setSheet] = useState(null);
  const touchDragging = useRef(false);
  const swipe = useRef(null);
  const [sync, setSync] = useState(fb ? 'off' : 'unavailable');
  const [syncChoice, setSyncChoice] = useState(null);
  const revRef = useRef(parseInt(lsGet('tb.rev.v1') || '0', 10) || 0);
  const dirtyRef = useRef(lsGet('tb.dirty.v1') === '1');
  const readyRef = useRef(false);
  const lastKeyRef = useRef('');
  const bundleRef = useRef();

  const cfg = { hardStop: '18:00', workStart: '00:00', theme: 'dark', ...settings };
  useEffect(() => save(KEYS.days, days), [days]);
  useEffect(() => save(KEYS.tasks, tasks), [tasks]);
  useEffect(() => save(KEYS.settings, settings), [settings]);
  useEffect(() => save(KEYS.inbox, inbox), [inbox]);
  useEffect(() => save(KEYS.tpls, tpls), [tpls]);
  useEffect(() => { document.documentElement.dataset.theme = cfg.theme; }, [cfg.theme]);
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 30000); return () => clearInterval(t); }, []);
  useEffect(() => { const h = () => setNarrow(window.innerWidth < 860); window.addEventListener('resize', h); return () => window.removeEventListener('resize', h); }, []);
  const patchCfg = patch => setSettings(s => ({ ...s, ...patch }));
  const syncSettings = (({ focus, carryDismissed, ...rest }) => rest)(settings);
  const syncSettingsKey = JSON.stringify(syncSettings);
  bundleRef.current = { v: 1, days, tasks, inbox, tpls, settings: syncSettings };
  const setDirty = v => { dirtyRef.current = v; lsSet('tb.dirty.v1', v ? '1' : '0'); };

  /* ── cloud sync ── */
  const pushNow = async uid => {
    const bundle = bundleRef.current, enc = await encodeBundle(bundle);
    const size = enc.gz ? enc.gz.toUint8Array().length : enc.json.length;
    if (size > 950000) throw new Error('too-large');
    const rev = revRef.current + 1;
    await fb.db.collection('users').doc(uid).set({ ...enc, rev, deviceId: DEVICE, updatedAt: Date.now() });
    revRef.current = rev; lsSet('tb.rev.v1', String(rev)); lastKeyRef.current = JSON.stringify(bundle); setDirty(false);
  };
  const applyBundle = (data, rev) => {
    const d = { v: 1, days: data.days || {}, tasks: data.tasks || [], inbox: data.inbox || [], tpls: data.tpls || [], settings: data.settings || {} };
    bundleRef.current = d; lastKeyRef.current = JSON.stringify(d);
    daysRef.current = d.days; setDays(d.days); setTasks(d.tasks); inboxRef.current = d.inbox; setInbox(d.inbox); setTpls(d.tpls);
    setSettings(s => ({ ...d.settings, focus: s.focus, carryDismissed: s.carryDismissed }));
    revRef.current = rev; lsSet('tb.rev.v1', String(rev)); hist.current = []; setCanUndo(false); setDirty(false);
  };
  const finishSync = uid => { lsSet('tb.syncuid.v1', uid); readyRef.current = true; setSync('synced'); };
  const resolveChoice = async how => {
    const { rd, rrev } = syncChoice; setSyncChoice(null);
    try {
      if (how === 'cloud') applyBundle(rd, rrev);
      else if (how === 'device') { revRef.current = Math.max(revRef.current, rrev); await pushNow(user.uid); }
      else { revRef.current = Math.max(revRef.current, rrev); applyBundle(mergeBundles(bundleRef.current, rd), revRef.current); await pushNow(user.uid); }
      finishSync(user.uid);
    } catch (e) { setSync('error'); }
  };
  const signInProvider = async kind => {
    if (!fb) { flash('Cloud sync is unavailable (Firebase could not load).'); return; }
    let prov;
    if (kind === 'apple') { prov = new firebase.auth.OAuthProvider('apple.com'); prov.addScope('email'); prov.addScope('name'); }
    else prov = new firebase.auth.GoogleAuthProvider();
    try { await fb.auth.signInWithPopup(prov); }
    catch (e) {
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') fb.auth.signInWithRedirect(prov);
      else if (e.code === 'auth/unauthorized-domain') flash('This site is not an authorized domain in Firebase → Authentication → Settings.');
      else if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') flash('Sign-in cancelled');
      else if (e.code === 'auth/account-exists-with-different-credential') flash('That email already uses a different sign-in method — use the one you signed up with.');
      else flash(authErrMsg(e.code));
    }
  };
  const emailAuth = async (mode, email, pw) => {
    if (!fb) return 'Cloud sync is unavailable (Firebase could not load).';
    try { if (mode === 'signup') await fb.auth.createUserWithEmailAndPassword(email, pw); else await fb.auth.signInWithEmailAndPassword(email, pw); return ''; }
    catch (e) { return authErrMsg(e.code); }
  };
  const resetPw = async email => {
    if (!email) return 'Enter your email above first.';
    try { await fb.auth.sendPasswordResetEmail(email); return 'ok'; } catch (e) { return authErrMsg(e.code); }
  };
  const signIn = () => setModal({ type: 'signin' });
  const signOut = () => { setModal(null); if (fb) fb.auth.signOut(); flash('Signed out — your data stays on this device'); };
  const syncNow = async () => {
    if (!user || !readyRef.current) { flash('Still connecting…'); return; }
    setSync('syncing');
    try { await pushNow(user.uid); setSync('synced'); flash('Synced'); } catch (e) { setSync(e.message === 'too-large' ? 'toolarge' : 'error'); }
  };
  useEffect(() => { if (!fb) return; return fb.auth.onAuthStateChanged(u => { setUser(u ? { uid: u.uid, name: u.displayName, email: u.email, photo: u.photoURL } : null); setAuthReady(true); }); }, []);
  useEffect(() => { if (user && !welcomed) { lsSet('tb.welcomed.v1', '1'); setWelcomed(true); } if (user) setModal(m => (m && m.type === 'signin' ? null : m)); }, [user]);
  const skipWelcome = () => { lsSet('tb.welcomed.v1', '1'); setWelcomed(true); };
  useEffect(() => {
    if (!fb || !user) { readyRef.current = false; setSync(fb ? 'off' : 'unavailable'); return; }
    let cancelled = false, unsub = null;
    const ref = fb.db.collection('users').doc(user.uid);
    const askChoice = (rd, rrev) => setSyncChoice({ rd, rrev });
    readyRef.current = false; setSync('syncing');
    (async () => {
      try {
        const snap = await ref.get(); if (cancelled) return;
        if (!snap.exists) { await pushNow(user.uid); finishSync(user.uid); }
        else {
          const rd = await decodeBundle(snap.data()), rrev = snap.data().rev || 0;
          const sameUser = lsGet('tb.syncuid.v1') === user.uid;
          if (sameUser) {
            if (rrev > revRef.current) { if (dirtyRef.current) askChoice(rd, rrev); else { applyBundle(rd, rrev); finishSync(user.uid); } }
            else if (dirtyRef.current || rrev < revRef.current) { await pushNow(user.uid); finishSync(user.uid); }
            else finishSync(user.uid);
          } else if (!hasData(bundleRef.current)) { applyBundle(rd, rrev); finishSync(user.uid); }
          else askChoice(rd, rrev);
        }
        if (cancelled) return;
        unsub = ref.onSnapshot(s => {
          if (!readyRef.current || !s.exists || s.metadata.hasPendingWrites) return;
          const d = s.data();
          if (d.deviceId === DEVICE || (d.rev || 0) <= revRef.current) return;
          decodeBundle(d).then(rd => { if (dirtyRef.current) askChoice(rd, d.rev || 0); else { applyBundle(rd, d.rev || 0); flash('Updated from another device'); } });
        });
      } catch (e) { setSync('error'); }
    })();
    return () => { cancelled = true; if (unsub) unsub(); };
  }, [user && user.uid]);
  useEffect(() => {
    if (!fb || !user) return;
    if (JSON.stringify(bundleRef.current) === lastKeyRef.current) return;
    setDirty(true);
    if (!readyRef.current) return;
    setSync(navigator.onLine ? 'syncing' : 'offline');
    const t = setTimeout(async () => { try { await pushNow(user.uid); setSync('synced'); } catch (e) { setSync(e.message === 'too-large' ? 'toolarge' : navigator.onLine ? 'error' : 'offline'); } }, 1500);
    return () => clearTimeout(t);
  }, [days, tasks, inbox, tpls, syncSettingsKey]);
